name: Golden Solution Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevalidate:
    if: github.head_ref == 'golden-solution' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate golden-solution branch shape and tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/validate-golden-solution.sh
